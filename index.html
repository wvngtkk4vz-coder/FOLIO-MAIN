<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: phone-first app column; on desktop a left rail, centred feed and a right rail. */
:root{--bg:#f5f4f1;--card:#fff;--fg:#16181b;--mute:#6a6f76;--line:#e6e4df;--accent:#0a7c78;--accent-ink:#fff;--soft:#edf3f2;--heart:#e11d48;--gold:#b45309;--ok:#15803d;--bad:#b91c1c;--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -14px rgba(0,0,0,.22);--r:14px;--f-display:'Instrument Serif',Georgia,'Times New Roman',serif;--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d0e;--card:#141719;--fg:#ecebe7;--mute:#8b9298;--line:#25292c;--accent:#42d3cb;--accent-ink:#04201f;--soft:#142021;--heart:#fb4a73;--gold:#f0b35a;--ok:#4ade80;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d0e;--card:#141719;--fg:#ecebe7;--mute:#8b9298;--line:#25292c;--accent:#42d3cb;--accent-ink:#04201f;--soft:#142021;--heart:#fb4a73;--gold:#f0b35a;--ok:#4ade80;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.fill{fill:currentColor}
#app{display:grid;grid-template-columns:minmax(0,1fr);height:100%;max-width:1200px;margin:0 auto}
#side,#right{display:none}
#col{display:flex;flex-direction:column;height:100%;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.brand{font:400 27px/1 var(--f-display);letter-spacing:-.01em;flex:1;cursor:pointer}
.brand i{font-style:italic;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:600;white-space:nowrap}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.chip.paused::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--gold)}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.iconbtn:hover{background:var(--soft)}
.badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--heart);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:84px;scroll-behavior:auto}
#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
#bottom button,.navb{position:relative;width:52px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--mute)}
#bottom button.on,.navb.on{color:var(--fg)}
#bottom button.on svg,.navb.on svg{stroke-width:2.4}
#newpill{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:7;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:7px 14px;border-radius:99px;box-shadow:var(--shadow)}
#banner{background:var(--gold);color:#fff;text-align:center;font-weight:600;font-size:12px;padding:5px 10px}
@media(min-width:900px){
#app{grid-template-columns:232px minmax(0,630px) 310px;gap:0 22px}
#side{display:flex;flex-direction:column;gap:2px;padding:18px 8px;height:100%;overflow-y:auto}
#side .brand{padding:6px 12px 16px;font-size:34px;flex:none}
#side .navb{width:auto;height:48px;display:flex;justify-content:flex-start;gap:14px;padding:0 12px;font-size:15px;color:var(--fg);place-items:unset;align-items:center}
#side .navb.on{font-weight:700;background:var(--soft)}
#side .navb:hover{background:var(--soft)}
#right{display:block;padding:18px 0;height:100%;overflow-y:auto}
#bottom{display:none}#view{padding-bottom:30px}
#top .brand{display:none}#top{justify-content:flex-end;border-bottom:0}
#newpill{top:56px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.sec{margin:14px 0}
.h{font:400 22px/1.15 var(--f-display);margin:0 0 8px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}.sm{font-size:12px}.b{font-weight:700}.tc{text-align:center}
.row{display:flex;align-items:center;gap:10px;min-width:0}.row.wrap{flex-wrap:wrap}.sp{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:10px;background:var(--soft);font-weight:700;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden;background-size:cover;background-position:center;text-transform:uppercase}
.av.ring{padding:2px;background:conic-gradient(var(--accent),var(--gold),var(--heart),var(--accent))}
.av.ring>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);overflow:hidden;font-weight:700;color:#fff}
.vb{display:inline-block;vertical-align:-3px;width:15px;height:15px;margin-left:3px}
.nm{font-weight:700;cursor:pointer}.nm:hover{text-decoration:underline}
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;flex:none;font-size:11px;cursor:pointer}
.st b{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chips button{padding:6px 12px;border-radius:99px;background:var(--soft);font-weight:600;font-size:12.5px;white-space:nowrap}
.chips button.on{background:var(--fg);color:var(--bg)}
.post{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
.post .hd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post .hd .sub{font-size:12px;color:var(--mute)}
.media{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;background:var(--soft);overflow:hidden}
.media svg{width:100%;height:100%;display:block}
.tcard{width:100%;aspect-ratio:1/1;display:grid;place-items:center;padding:9%;text-align:center;color:#fff;font:400 clamp(20px,4.6vw,30px)/1.2 var(--f-display);overflow:hidden;position:relative}
.tcard small{position:absolute;left:12px;bottom:10px;font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.acts{display:flex;align-items:center;gap:4px;padding:6px 8px 0}
.acts button{display:flex;align-items:center;gap:5px;padding:6px;border-radius:10px}
.acts button.on{color:var(--heart)}.acts button.on svg{fill:var(--heart);stroke:var(--heart)}
.acts .sv.on{color:var(--fg)}.acts .sv.on svg{fill:var(--fg)}
.cap{padding:2px 12px 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.cap .nm{margin-right:5px}
.tag{color:var(--accent);font-weight:600;cursor:pointer}
.stat{padding:0 12px;font-weight:700}
.vc{padding:0 12px 10px;color:var(--mute);font-size:13px;cursor:pointer}
.news{margin:0 12px 10px;padding:12px;border-radius:12px;background:var(--soft);border-left:4px solid var(--accent)}
.news h4{margin:2px 0 4px;font:400 21px/1.15 var(--f-display)}
.cm{display:flex;gap:10px;padding:8px 12px;align-items:flex-start}
.cm.rep{padding-left:calc(12px + 38px * var(--d))}
.cm .bd{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.cm .ma{display:flex;gap:12px;color:var(--mute);font-size:12px;margin-top:2px;flex-wrap:wrap;align-items:center}
.cm .ma button{font-weight:600;color:var(--mute)}
.cm .ma button:hover{color:var(--fg)}
.cm .lk{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);min-width:26px;padding-top:2px}
.cm .lk button.on{color:var(--heart)}.cm .lk svg{width:15px;height:15px}.cm .lk button.on svg{fill:var(--heart)}
.pin{font-size:11px;color:var(--mute);font-weight:600}
.cmbox{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);align-items:flex-end}
.cmbox textarea{flex:1;border:1px solid var(--line);border-radius:18px;padding:8px 14px;resize:none;background:var(--bg);max-height:120px;min-height:38px}
.modes{display:flex;gap:6px;padding:6px 12px 0;flex-wrap:wrap}
.modes button{padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute)}
.modes button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid3>div{position:relative;aspect-ratio:1/1;overflow:hidden;cursor:pointer;background:var(--soft)}
.grid3 .tcard{padding:8%;font-size:clamp(11px,2.4vw,15px);aspect-ratio:auto;height:100%}
.grid3 .ov{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.grid3 .ov svg{width:18px;height:18px}
.grid3 .hov{position:absolute;inset:auto 0 0 0;padding:4px 6px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 4px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.pf{padding:16px 14px}
.nums{display:flex;gap:18px;text-align:center}
.nums b{display:block;font-size:17px}
.hl{display:flex;gap:14px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.item{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.item:hover{background:var(--soft)}
.item.unread{background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.thread{display:flex;flex-direction:column;gap:6px;padding:14px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--soft);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.sys{align-self:center;background:none;color:var(--mute);font-size:12px}
.typing{align-self:flex-start;color:var(--mute);font-size:12px;padding-left:6px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s}
.meter{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{padding:12px;border-radius:12px;background:var(--soft)}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sect{padding:12px 14px 4px}
.trend{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;cursor:pointer}
.trend:hover{background:var(--soft)}
.trend b{display:block}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--soft);font-size:11px;font-weight:700;color:var(--mute)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.gold{color:var(--gold)}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
textarea.in{min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,8,9,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 10px;font:400 26px/1.1 var(--f-display)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.types button{padding:10px 6px;border-radius:12px;background:var(--soft);font-weight:600;font-size:12px;border:2px solid transparent}
.types button.on{border-color:var(--accent)}
.wiz{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.wiz .in-w{max-width:760px;margin:0 auto;padding:22px 16px 90px}
.wiz h1{font:400 44px/1 var(--f-display);margin:6px 0 4px}
.wiz h1 i{color:var(--accent)}
.steps{display:flex;gap:6px;margin:14px 0 18px}.steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--accent)}
.bookc{padding:14px;margin-bottom:12px}
.bookc summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center}
.wizbar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}
#storyv{position:fixed;inset:0;z-index:50;background:#000;display:none;align-items:center;justify-content:center}
#storyv.on{display:flex}
.sv-in{position:relative;width:100%;max-width:420px;height:100%;max-height:820px;display:flex;flex-direction:column;color:#fff}
.sv-bg{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;font:400 32px/1.2 var(--f-display);background-size:cover;background-position:center}
.sv-top{position:relative;z-index:2;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.sv-bar{height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}.sv-bar i{display:block;height:100%;background:#fff;width:0}
.sv-poll{position:relative;z-index:2;margin:auto 20px 20px;padding:12px;border-radius:14px;background:rgba(255,255,255,.92);color:#111}
.sv-poll .o{position:relative;padding:9px 12px;border-radius:9px;background:#eee;margin-top:6px;overflow:hidden;font-weight:700}
.sv-poll .o i{position:absolute;left:0;top:0;bottom:0;background:rgba(10,124,120,.3)}
.sv-poll .o span{position:relative}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:90%}
.polls .o{position:relative;margin:6px 12px;padding:10px 12px;border-radius:10px;background:var(--soft);overflow:hidden;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.polls .o i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 28%,transparent)}
.polls .o span{position:relative}
.ev{padding:10px 12px;border-radius:12px;background:var(--soft);margin:6px 0}
.ev.rare{border:1px solid var(--gold)}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ent{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
hr.s{border:0;border-top:1px solid var(--line);margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:6px 12px;font-weight:700;font-size:12px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="col">
    <header id="top"></header>
    <div id="banner" hidden></div>
    <main id="view"></main>
    <div id="newpill" hidden>New activity ↑</div>
    <nav id="bottom"></nav>
  </div>
  <aside id="right"></aside>
</div>
<div id="modal"></div>
<div id="storyv"></div>
<div id="wiz"></div>
<div id="toastbox"></div>
<script>
'use strict';
var S=null; // the whole world lives here
const IS_BROWSER=typeof document!=='undefined';
const R={
  f:()=>Math.random(),
  i:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  chance:p=>Math.random()<p,
  pickn(a,n){const c=a.slice(),o=[];while(c.length&&o.length<n)o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return o},
  wpick(items,wf){let t=0;const ws=items.map(x=>{const w=Math.max(0,wf(x));t+=w;return w});if(t<=0)return items[Math.floor(Math.random()*items.length)];let r=Math.random()*t;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]},
  g(){return (Math.random()+Math.random()+Math.random()-1.5)/1.5}
};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){n=Math.floor(n||0);if(n<1e4)return n.toLocaleString('en-US');if(n<1e6)return (n/1e3).toFixed(n<1e5?1:0).replace(/\.0$/,'')+'K';return (n/1e6).toFixed(n<1e7?2:1).replace(/\.?0+$/,'')+'M'}
function hash(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function uid(p){S.nid=(S.nid||1)+1;return p+S.nid.toString(36)}
function cap1(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function uniq(a){return Array.from(new Set(a))}
function lines(s){return String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function csv(s){return String(s||'').split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean)}
function timeAgo(hr){const d=S.hour-hr;if(d<1)return 'now';if(d<24)return Math.floor(d)+'h';if(d<168)return Math.floor(d/24)+'d';if(d<24*60)return Math.floor(d/168)+'w';if(d<24*365)return Math.floor(d/(24*30))+'mo';return Math.floor(d/(24*365))+'y'}
function simDate(hr){const d=new Date((S.t0||Date.now())+hr*3600e3);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function simClock(){const d=new Date((S.t0||Date.now())+S.hour*3600e3);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+String(d.getHours()).padStart(2,'0')+':00'}
function humanAgo(h){if(h<3)return 'earlier';if(h<30)return 'yesterday';const d=Math.round(h/24);if(d<7)return d+' days ago';const w=Math.round(d/7);if(d<30)return w===1?'last week':w+' weeks ago';const m=Math.round(d/30);if(m<12)return m===1?'last month':m+' months ago';const y=Math.round(d/365);return y===1?'last year':y+' years ago'}

  if(c.liked&&c.by!=='me'){const p=P(c.by);tickMood(p,.35);remember(p,{t:'liked',text:c.text});S.stats.loyalty=clamp(S.stats.loyalty+.1,0,100);c.likes+=R.i(2,12)}
  S.lastActive=S.hour;touch()}
function deleteComment(post,c){
  const kids=new Set([c.id]);let ch=true;while(ch){ch=false;post.comments.forEach(x=>{if(x.parent&&kids.has(x.parent)&&!kids.has(x.id)){kids.add(x.id);ch=true}})}
  post.comments=post.comments.filter(x=>!kids.has(x.id));
  if(c.by!=='me'){const p=P(c.by);if(!p.ghost){remember(p,{t:'deleted',text:c.text});tickMood(p,-.6)}S.stats.trust=clamp(S.stats.trust-.6,0,100);
    S.delLog=(S.delLog||[]).filter(h=>S.hour-h<48);S.delLog.push(S.hour);
    if(S.delLog.length>=5)addControversy('Author deleting comments',10);
    if(POL[c.intent]<0&&c.likes>10&&R.chance(.4))schedule(()=>{const q=pickFan(p=>.2+p.snark);if(q){const f=makeFanPost(q,'criticism',{react:2});if(f)f.text='the author just deleted a critical comment that had '+c.likes+' likes. interesting. '+f.text.slice(0,0)}},3500,false)}
  S.lastActive=S.hour;touch()}
function pinComment(post,c){
  const was=c.pinned;post.comments.forEach(x=>x.pinned=false);c.pinned=!was;
  if(c.pinned&&c.by!=='me'){const p=P(c.by);tickMood(p,.5);remember(p,{t:'liked',text:c.text})}touch()}
function deletePost(post){
  S.posts=S.posts.filter(p=>p!==post);S.pinnedPosts=S.pinnedPosts.filter(i=>i!==post.id);
  if(post.viral){S.stats.trust=clamp(S.stats.trust-3,0,100);addControversy('Author deleted a viral post',14)}touch()}
function pinPost(post){
  if(post.pinned){post.pinned=false;S.pinnedPosts=S.pinnedPosts.filter(i=>i!==post.id)}
  else{if(S.pinnedPosts.length>=3){const old=S.posts.find(p=>p.id===S.pinnedPosts.shift());if(old)old.pinned=false}post.pinned=true;S.pinnedPosts.push(post.id)}touch()}
function followToggle(pid){
  const i=S.followingIds.indexOf(pid);if(i>=0)S.followingIds.splice(i,1);else{S.followingIds.push(pid);const p=P(pid);if(!p.ghost){tickMood(p,.4);if(p.kind==='author')p.rel=p.rel==='rival'?'neutral':p.rel;if(R.chance(.6)&&p.kind==='fan')notify({type:'follow',pid,text:`@${p.user} noticed you followed them.`,link:{view:'profile',id:pid}})}}
  S.lastActive=S.hour;touch()}
function rumourAct(id,act){
  const r=S.rumours.find(x=>x.id===id);if(!r)return;const s=S.stats;
  if(act==='confirm'){r.status='confirmed';s.hype=clamp(s.hype+9,0,100);s.mystery=clamp(s.mystery-3,0,100);s.trust=clamp(s.trust+1,0,100);canonAdd({text:r.text,status:'true',src:'rumour'});logEvent('Confirmed rumour: '+r.text)}
  else if(act==='deny'){r.status='denied';r.spread=0;s.hype=clamp(s.hype-3,0,100);s.mystery=clamp(s.mystery+1,0,100);canonAdd({text:r.text,status:'false',src:'rumour'});logEvent('Denied rumour: '+r.text);
    if(R.chance(.5))schedule(()=>{const q=pickFan(p=>.2+p.snark+p.obs);if(q){const f=makeFanPost(q,'discussion',{react:3});if(f)f.text='the author "denied" the rumour about '+r.text.slice(0,50)+'. that is exactly what someone who was sitting on it would say'}},3000,false)}
  S.lastActive=S.hour;
  for(let i=0;i<3;i++)schedule(()=>{const q=pickFan(p=>.2+p.obs);if(q){const f=makeFanPost(q,R.pick(['discussion','meme','theory']),{react:2});if(f&&f.ptype==='discussion'&&act==='confirm')f.text='WAIT '+r.text.slice(0,60)+' IS REAL?? '+f.text.slice(0,0)}},2000+i*2400,false);

function startRumour(text){const r=spawnRumour(text);if(r){r.src='me';S.stats.mystery=clamp(S.stats.mystery+3,0,100);S.stats.hype=clamp(S.stats.hype+3,0,100);S.lastActive=S.hour;logEvent('You started a rumour: '+text)}touch();return r}
function theoryAct(id,act){
  const t=S.theories.find(x=>x.id===id);if(!t)return;
  if(act==='confirm'){canonAdd({text:t.text,status:'true',src:'theory'});resolveTheoriesByText(t.text,'true');t.status='confirmed';S.stats.trust=clamp(S.stats.trust+.8,0,100);S.revealCount=(S.revealCount||0)+1}
  else if(act==='deny'){canonAdd({text:t.text,status:'false',src:'theory'});resolveTheoriesByText(t.text,'false');t.status='denied';if(t.hit>=.66&&R.chance(.7)){addControversy('Fans think the author lied about a theory',12);S.stats.trust=clamp(S.stats.trust-1.5,0,100)}}
  else if(act==='secret'){canonAdd({text:t.text,status:'secret',src:'theory'});S.stats.mystery=clamp(S.stats.mystery+3,0,100)}
  S.lastActive=S.hour;
  const p=P(t.by);if(act!=='secret'&&!p.ghost){schedule(()=>{const post=makeFanPost(p,'discussion',{react:3});if(post)post.text=act==='confirm'?'THE AUTHOR CONFIRMED IT. “'+t.text+'”. do not talk to me.':'so the author says “'+t.text+'” is false. back to the drawing board I guess'},1800,true)}
  touch()}
function addCanonFact(text,status){text=String(text||'').trim();if(!text)return;canonAdd({text,status:status||'true',src:'codex'});if(status==='true')S.revealCount=(S.revealCount||0)+1;S.lastActive=S.hour;touch()}
function setRelease(bookId,days){const b=S.books.find(x=>x.id===bookId);if(!b)return;b.status='upcoming';b.relHour=S.hour+Math.max(0,days)*24;touch()}

function buildThread(post){
  const cs=post.comments,byId={};cs.forEach(c=>byId[c.id]=c);
  const kids={};const roots=[];
  cs.forEach(c=>{if(c.parent&&byId[c.parent]){(kids[c.parent]=kids[c.parent]||[]).push(c)}else roots.push(c)});
  roots.sort((a,b)=>(b.pinned-a.pinned)||(UI.cmSort==='new'?b.hour-a.hour:(b.by==='me'?1e9:b.likes)-(a.by==='me'?1e9:a.likes)||b.hour-a.hour));
  const out=[];const walk=(c,d)=>{out.push(c);(kids[c.id]||[]).sort((a,b)=>a.hour-b.hour).forEach(k=>walk(k,d+1))};
  roots.forEach(r=>walk(r,0));return out}

  const mine=c.by==='me',pm=post.by==='me';
  const d=Math.min(3,c.depth||0);

   <div class="ma"><span>${timeAgo(c.hour)}</span>${c.likes?`<span>${fmt(c.likes)} likes</span>`:''}<button data-act="reply" data-pid="${post.id}" data-id="${c.id}">Reply</button>${pm||mine?`<button data-act="cpin" data-pid="${post.id}" data-id="${c.id}">${c.pinned?'Unpin':'Pin'}</button>`:''}${pm||mine?`<button data-act="cdel" data-pid="${post.id}" data-id="${c.id}">Delete</button>`:''}${c.authorLiked&&!mine?'<span title="Liked by you">♥ by you</span>':''}</div></div>
   <div class="lk"><button class="${c.liked?'on':''}" data-act="clike" data-pid="${post.id}" data-id="${c.id}" aria-label="Like comment">${ic('heart')}</button></div></div>`}

function searchResults(q){

  const bks=S.books.filter(b=>b.title.toLowerCase().includes(bare)||hashtagFor(b.title).toLowerCase()===ql);

  const posts=S.posts.filter(p=>!p.deleted&&(((p.text||'')+' '+(p.headline||'')).toLowerCase().includes(bare)||(p.tags||[]).some(t=>t.toLowerCase()===ql)||(isTag&&((p.text||'')+(p.headline||'')).toLowerCase().replace(/[^a-z0-9]/g,'').includes(bare)))).sort((a,b)=>b.likes-a.likes).slice(0,18);
  if(posts.length)h+=`<div class="sect lbl">Posts</div><div class="grid3">${posts.map(tileHTML).join('')}</div>`;

  return h||`<div class="empty">No results for “${esc(q)}”.</div>`}

  else if(tab==='stats'){const tl=mine.reduce((a,p)=>a+p.likes,0);body=`<div class="pf"><div class="stg"><div class="tile"><b>${fmt(S.followers)}</b><span class="mute sm">followers</span></div><div class="tile"><b>${pubs.length}</b><span class="mute sm">books published</span></div><div class="tile"><b>${fmt(mine.length)}</b><span class="mute sm">posts</span></div><div class="tile"><b>${fmt(tl)}</b><span class="mute sm">total likes</span></div><div class="tile"><b>${fmt(S.books.reduce((a,b)=>a+(b.sales||0),0))}</b><span class="mute sm">copies sold</span></div><div class="tile"><b>${S.canon.filter(c=>c.status==='true').length}</b><span class="mute sm">canon facts</span></div></div><div style="margin-top:14px">${meters()}</div></div>`}
  else body=list.length?`<div class="grid3">${list.map(tileHTML).join('')}</div>`:`<div class="empty">${tab==='pinned'?'Nothing pinned. Use the ⋯ menu on a post.':'No posts yet. Tap + to share something.'}</div>`;

  else if(t==='rumours'){

function bookFormHTML(i,b,opt){
  b=b||{};opt=opt||{};
  return `<div data-bk="${i}"><div class="g2"><div class="field"><label class="lbl">Status</label><select class="in" data-f="status" data-on-change="bkstatus"><option value="published" ${b.status!=='upcoming'?'selected':''}>Published</option><option value="upcoming" ${b.status==='upcoming'?'selected':''}>Upcoming</option></select></div><div class="field" data-rd ${b.status==='upcoming'?'':'hidden'}><label class="lbl">Releases in (days)</label><input class="in" type="number" min="0" data-f="releaseDays" value="${b.releaseDays==null?90:b.releaseDays}"></div></div>
  <div class="g2">${BOOK_FIELDS.map(([k,l,t,short])=>`<div class="field" ${t==='ta'&&!short?'style="grid-column:1/-1"':''}><label class="lbl">${l}</label>${t==='ta'?`<textarea class="in" data-f="${k}" rows="2">${esc(b[k]||'')}</textarea>`:`<input class="in" data-f="${k}" value="${esc(b[k]||'')}">`}</div>`).join('')}</div></div>`}
ACT.bkstatus=el=>{const root=el.closest('[data-bk]');const rd=root&&root.querySelector('[data-rd]');if(rd)rd.hidden=el.value!=='upcoming'};
function readBookForm(root){const b={};$$('[data-f]',root).forEach(e=>{b[e.getAttribute('data-f')]=e.value.trim()});b.releaseDays=Math.max(0,+b.releaseDays||0);return b}
ACT.bookform=()=>{
  openModal(`<h3>Add a book</h3><p class="mute sm" style="margin-top:-4px">Everything you enter becomes canon. Fill in as much or as little as you like; the world will invent the rest.</p><div id="bf">${bookFormHTML(0,{status:'upcoming',genre:S.author.genre})}</div>
   <label class="row" style="margin:6px 0 12px"><input type="checkbox" id="bfauto" checked> Auto-generate extra lore</label>
   <div class="row" style="justify-content:flex-end"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="bfsave">Add book</button></div>`)};
ACT.bfsave=()=>{
  const b=readBookForm($('#bf [data-bk]'));if(!b.title){toast('Give the book a title');return}
  if(S.books.some(x=>x.title.toLowerCase()===b.title.toLowerCase())){toast('You already have a book with that title');return}
  const st=b.status==='published'?'published':'upcoming';
  const bk=addBook(Object.assign({},b,{agoDays:st==='published'?R.i(5,40):null}),st,S.books.length+1);
  if(st==='upcoming'&&!b.releaseDays)bk.relHour=null;
  lines(b.future).forEach(t=>{if(!S.books.some(x=>x.title.toLowerCase()===t.toLowerCase()))addBook({title:t,genre:b.genre},'upcoming',S.books.length+1)});
  if($('#bfauto').checked)expandLore(4);
  _entRe=null;S.stats.hype=clamp(S.stats.hype+(st==='upcoming'?3:0),0,100);logEvent('Added to your world: '+bk.title);
  closeModal();toast('Book added');render(false)};
// ---- profile editor ----
ACT.editprofile=()=>{
  const A=S.author;
  openModal(`<h3>Edit profile</h3><div class="row" style="margin-bottom:12px">${avatarOf('me',64)}<label class="btn sm" style="cursor:pointer">Change photo<input type="file" accept="image/*" data-on-change="avfile" hidden></label></div>
   <div class="g2"><div class="field"><label class="lbl">Name</label><input class="in" id="epname" value="${esc(A.name)}"></div><div class="field"><label class="lbl">Pen name</label><input class="in" id="eppen" value="${esc(A.pen||'')}"></div><div class="field"><label class="lbl">Username</label><input class="in" id="epuser" value="${esc(S.authorHandle)}"></div><div class="field"><label class="lbl">Genre</label><input class="in" id="epgenre" value="${esc(A.genre||'')}"></div></div>
   <div class="field"><label class="lbl">Bio</label><textarea class="in" id="epbio" rows="3">${esc(A.bio||'')}</textarea></div>
   <div class="row" style="justify-content:flex-end"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="epsave">Save</button></div>`)};
ACT.avfile=async el=>{const f=el.files&&el.files[0];if(!f)return;try{const d=await fileToDataURL(f,320);S.author.avatar=storeImg(d);toast('Photo updated');ACT.editprofile()}catch(e){toast('Could not read that image')}};
ACT.epsave=()=>{
  const A=S.author;const n=$('#epname').value.trim();if(!n){toast('Name is required');return}
  A.name=n;A.pen=$('#eppen').value.trim();A.genre=$('#epgenre').value.trim()||A.genre;A.bio=$('#epbio').value.trim();
  const u=uniqueHandleMe($('#epuser').value);if(u&&!S.pids.some(id=>S.people[id].user===u))S.authorHandle=u;
  closeModal();render(false);toast('Profile saved')};
// ---------- setup wizard ----------
let W=null;
const FAME_OPTS=[['unknown','Unknown debut author'],['rising','Rising name'],['established','Established author'],['bestseller','Bestselling author'],['phenomenon','Global phenomenon']];
const REP_OPTS=[['beloved','Beloved by readers'],['respected','Respected by critics'],['unknown','No reputation yet'],['polarizing','Polarizing'],['controversial','Controversial']];
function newW(){return {step:1,author:{name:'',pen:'',user:'',age:35,genre:'',style:'',personality:'',bio:'',career:'',fameLevel:'rising',followers:FAME_PRESET.rising,numBooks:1,reputation:'unknown'},books:[{status:'published'}],avatar:null,auto:true,folEdited:false}}
function openWizard(){if(!W)W=newW();drawWizard()}
function readWiz(){
  if(!W)return;const g=id=>{const e=$('#'+id);return e?e.value:null};const A=W.author;
  if(W.step===1){['name','pen','user','genre','style','personality','bio','career'].forEach(k=>{const v=g('w_'+k);if(v!=null)A[k]=v});
    const age=g('w_age');if(age!=null)A.age=clamp(+age||35,14,110);const fl=g('w_fameLevel');if(fl!=null)A.fameLevel=fl;const rp=g('w_reputation');if(rp!=null)A.reputation=rp;
    const fo=g('w_followers');if(fo!=null)A.followers=Math.max(1,Math.round(+fo||1));const nb=g('w_numBooks');if(nb!=null)A.numBooks=clamp(Math.round(+nb||0),0,40)}
  if(W.step===2){const roots=$$('#wbooks [data-bk]');if(roots.length)W.books=roots.map(r=>readBookForm(r))}
  const au=$('#w_auto');if(au)W.auto=au.checked}
function drawWizard(){
  const A=W.author,s=W.step;let body='';
  if(s===1){
    body=`<h2 class="h">Who are you?</h2><p class="mute">Create the author the world will revolve around.</p>
    <div class="row" style="margin:10px 0 16px">${W.avatar?`<div class="av" style="width:72px;height:72px;background-image:url(${W.avatar})"></div>`:`<div class="av" style="width:72px;height:72px;background:linear-gradient(135deg,var(--accent),#222);font-size:26px">${esc(initials(A.pen||A.name||'A'))}</div>`}<label class="btn sm" style="cursor:pointer">Profile photo<input type="file" accept="image/*" data-on-change="wavatar" hidden></label><span class="sp"></span><button class="btn sm" data-act="wfill">Quick-fill example</button></div>
    <div class="g2">
    <div class="field"><label class="lbl">Name</label><input class="in" id="w_name" value="${esc(A.name)}" placeholder="Eleanor Vance-Hale"></div>
    <div class="field"><label class="lbl">Pen name (optional)</label><input class="in" id="w_pen" value="${esc(A.pen)}" placeholder="E. V. Hale"></div>
    <div class="field"><label class="lbl">Username</label><input class="in" id="w_user" value="${esc(A.user)}" placeholder="evhale.writes"></div>
    <div class="field"><label class="lbl">Age</label><input class="in" type="number" id="w_age" min="14" max="110" value="${A.age}"></div>
    <div class="field"><label class="lbl">Genre</label><input class="in" id="w_genre" value="${esc(A.genre)}" placeholder="Epic fantasy, thriller, romance…"></div>
    <div class="field"><label class="lbl">Writing style</label><input class="in" id="w_style" value="${esc(A.style)}" placeholder="Lyrical, slow-burn…"></div>
    <div class="field"><label class="lbl">Personality</label><input class="in" id="w_personality" value="${esc(A.personality)}" placeholder="Dry-humoured, secretive…"></div>
    <div class="field"><label class="lbl">Number of books published</label><input class="in" type="number" min="0" max="40" id="w_numBooks" value="${A.numBooks}"></div>
    <div class="field"><label class="lbl">Fame level</label><select class="in" id="w_fameLevel" data-on-change="wfame">${FAME_OPTS.map(([k,l])=>`<option value="${k}" ${A.fameLevel===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">Starting followers</label><input class="in" type="number" min="1" id="w_followers" value="${A.followers}"></div>
    <div class="field"><label class="lbl">Reputation</label><select class="in" id="w_reputation">${REP_OPTS.map(([k,l])=>`<option value="${k}" ${A.reputation===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="field"><label class="lbl">Bio</label><textarea class="in" id="w_bio" rows="2">${esc(A.bio)}</textarea></div>
    <div class="field"><label class="lbl">Career background</label><textarea class="in" id="w_career" rows="2">${esc(A.career)}</textarea></div>`}
  else if(s===2){
    body=`<h2 class="h">Your books and your world</h2><p class="mute">Everything here becomes canon. Characters, secrets and mysteries you list become things fans will love, theorise about and argue over. Leave anything blank and the world will invent it.</p>
    <div id="wbooks">${W.books.map((b,i)=>`<details class="card bookc" ${i===0||W.books.length===1?'open':''}><summary>${esc(b.title||'Book '+(i+1))}${W.books.length>1?`<span class="sp"></span><button class="btn sm warn" data-act="wbrm" data-i="${i}">Remove</button>`:''}</summary><div style="margin-top:12px">${bookFormHTML(i,b)}</div></details>`).join('')}</div>
    <div class="row wrap"><button class="btn" data-act="wbadd">Add another book</button></div>
    <label class="row" style="margin-top:14px"><input type="checkbox" id="w_auto" ${W.auto?'checked':''}> Auto-generate extra lore (new characters, places, factions and mysteries)</label>`}
  else{
    const n=W.books.filter(b=>b.title).length;
    body=`<h2 class="h">Ready to enter</h2><p class="mute">Here is the world you are about to step into.</p>
    <div class="card pad"><div class="b" style="font-size:18px">${esc(A.pen||A.name||'Unnamed author')}</div><div class="mute">@${esc(uniqueHandleMe(A.user||(A.pen||A.name||'author').toLowerCase().replace(/\s+/g,'.')))} · ${esc(A.genre||'fiction')} · age ${A.age}</div><hr class="s"><div class="nums" style="justify-content:space-around"><div><b>${fmt(A.followers)}</b><span class="mute sm">followers</span></div><div><b>${Math.max(A.numBooks,W.books.filter(b=>b.title&&b.status!=='upcoming').length)}</b><span class="mute sm">published</span></div><div><b>${W.books.filter(b=>b.status==='upcoming'&&b.title).length}</b><span class="mute sm">upcoming</span></div></div><hr class="s"><div class="mute sm">${n?W.books.filter(b=>b.title).map(b=>esc(b.title)).join(' · '):'Your books will be generated for you.'}</div></div>
    <p class="mute" style="margin-top:14px">Thousands of readers, critics, rivals, journalists and publishers are about to notice you. They will remember what you say. Time starts moving as soon as you enter.</p>`}
  $('#wiz').className='wiz';
  $('#wiz').innerHTML=`<div class="in-w"><div class="brand" style="font-size:30px;flex:none">Fol<i>io</i></div><h1>Become <i>famous</i>.</h1><div class="steps">${[1,2,3].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>${body}
    <div class="wizbar"><button class="btn" data-act="wback" ${s===1?'disabled':''}>Back</button>${s<3?`<button class="btn pri" data-act="wnext">Continue</button>`:`<button class="btn pri" data-act="wenter" style="font-size:16px;padding:12px 28px">ENTER WORLD</button>`}</div></div>`;
  const sc=$('#wiz');sc.scrollTop=0}
ACT.wfame=el=>{readWiz();W.author.fameLevel=el.value;W.author.followers=FAME_PRESET[el.value]||W.author.followers;W.author.numBooks=Math.max(W.author.numBooks,{unknown:1,rising:2,established:5,bestseller:8,phenomenon:12}[el.value]||1);drawWizard()};
ACT.wavatar=async el=>{const f=el.files&&el.files[0];if(!f)return;readWiz();try{W.avatar=await fileToDataURL(f,320)}catch(e){toast('Could not read that image')}drawWizard()};
ACT.wfill=()=>{const E=EXAMPLE_UNIVERSE;W.author=Object.assign({},W.author,{name:E.author.name,pen:E.author.pen,user:E.author.user,age:E.author.age,genre:E.author.genre,style:E.author.style,personality:E.author.personality,bio:E.author.bio,career:E.author.career,fameLevel:E.author.fameLevel,followers:E.author.followers,reputation:E.author.reputation,numBooks:3});W.books=[Object.assign({status:'published'},E.book)];if(W.step!==1)W.step=1;drawWizard();toast('Example filled in. Edit anything you like.')};
ACT.wbadd=()=>{readWiz();W.books.push({status:'upcoming',genre:W.author.genre});drawWizard();const d=$$('#wbooks details');if(d.length)d[d.length-1].open=true};
ACT.wbrm=(el,e)=>{e.preventDefault();readWiz();W.books.splice(+el.getAttribute('data-i'),1);if(!W.books.length)W.books=[{status:'published'}];drawWizard()};
ACT.wback=()=>{readWiz();W.step=Math.max(1,W.step-1);drawWizard()};
ACT.wnext=()=>{
  readWiz();
  if(W.step===1){if(!W.author.name.trim()&&!W.author.pen.trim()){toast('Give your author a name');return}if(!W.author.genre.trim())W.author.genre='Fantasy'}
  W.step=Math.min(3,W.step+1);drawWizard()};
ACT.wenter=()=>{
  readWiz();const A=W.author;
  if(!A.name.trim()&&!A.pen.trim()){W.step=1;drawWizard();toast('Give your author a name');return}
  $('#wiz').innerHTML=`<div class="in-w tc" style="padding-top:30vh"><div class="brand" style="font-size:40px;flex:none">Fol<i>io</i></div><p class="mute">Building your world…</p></div>`;
  setTimeout(()=>{
    try{
      const author=Object.assign({},A);author.name=A.name.trim()||A.pen.trim();author.pen=A.pen.trim();author.genre=A.genre.trim()||'Fantasy';
      author.user=uniqueHandleMe(A.user||(A.pen||A.name).toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,''));
      const books=W.books.filter(b=>b.title&&b.title.trim()).map(b=>Object.assign({},b,{genre:b.genre||author.genre}));
      newWorld({author,books});
      if(W.avatar)S.author.avatar=storeImg(W.avatar);
      if(W.auto)expandLore(6);
      _entRe=null;applyTheme();saveWorld();
      const av=W.avatar;W=null;
      $('#wiz').className='';$('#wiz').innerHTML='';
      UI.hist=[];UI.view='home';UI.param=null;startLoops();render(true);toast('Welcome to Folio');
    }catch(e){console.error(e);$('#wiz').className='wiz';W=W||newW();toast('Something went wrong building the world: '+e.message);drawWizard()}
  },60)};
// ---------- init ----------
function fixAfterLoad(){
  S.pids=Object.keys(S.people);
  S.mem=S.mem||{hashes:[],recent:[],tpl:[],intents:[],emo:[],opens:[]};
  S.imgs=S.imgs||{};S.myStories=S.myStories||[];S.seen=S.seen||{};S.settings=S.settings||{theme:'auto'};
  S.stories=(S.stories||[]).filter(s=>S.hour-s.hour<24);
  _entRe=null;
  try{ensurePeople(false)}catch(e){console.error(e)}}
function boot(){
  let ok=false;try{ok=loadWorld()}catch(e){ok=false}
  if(ok){try{fixAfterLoad();applyTheme();startLoops();render(true)}catch(e){console.error(e);resetWorld();location.reload();return}}
  else openWizard()}
let _warnedSave=false;
function autosave(){if(!S)return;if(!saveWorld()&&!_warnedSave){_warnedSave=true;toast('Browser storage is full. Remove some photos or start fresh to keep saving.')}}
setInterval(autosave,15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave()});
window.addEventListener('pagehide',autosave);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(_sv)closeStory();else if($('#modal').innerHTML)closeModal()}});
boot();
</script>
</body>
</html>
